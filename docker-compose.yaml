# ---------------------------------------------------------------------------
# EMSO ERIC central node: ERDDAP federation + validation gate + monitoring
#
#   erddap     the central federated data broker
#   database   federation history, validation results, diagnostics
#   grafana    dashboards over the database views
#   gate       the validation gate, as a one-shot job (profile: tools)
#
# The gate shares the erddap bind mounts deliberately. That is what lets it
# write datasets.xml and request a per-dataset reload by touching a flag file,
# instead of restarting ERDDAP and reloading the whole federation.
#
# `gate` is a one-shot job, not a service: `profiles: [tools]` keeps it out of
# `docker compose up`, and it exists so the gate can be run without a local
# Python environment or the compiled netCDF/UDUNITS dependencies:
#
#     docker compose run --rm gate check
#     docker compose run --rm gate run new
#     docker compose run --rm gate run all --trigger schedule
#     docker compose run --rm gate status
#
# Credentials come from .env (see .env.example), which Docker Compose reads
# automatically for both ${VAR} interpolation and env_file. Nothing secret
# belongs in this file.
# ---------------------------------------------------------------------------

services:

  erddap:
    container_name: emso-erddap
    image: erddap/erddap:v2.31.1
    restart: unless-stopped
    hostname: erddap
    env_file:
      - erddap/.env
    ports:
      - "${ERDDAP_PORT:-8080}:8080"
    volumes:
      # datasets.xml is generated by the gate. Bind-mounting the file rather
      # than the directory keeps everything else the gate writes under
      # erddap/ - backups, the flag directory - out of the container.
      - ./erddap/datasets.xml:/usr/local/tomcat/content/erddap/datasets.xml
      - ./erddap/data:/erddapData
      - ./erddap/logo.png:/usr/local/tomcat/webapps/erddap/images/logo.png:ro
      - ./erddap/favicon.ico:/usr/local/tomcat/webapps/erddap/images/favicon.ico:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/erddap/index.html || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  database:
    container_name: emso-gate-db
    image: postgres:17.11-alpine
    restart: always
    hostname: database
    env_file:
      - database/.env
    volumes:
      - ./database/pgdata:/var/lib/postgresql/data
    # Not published by default: only the gate and Grafana need it, and both
    # are on this network. Set GATE_DB_PORT to expose it for psql or Grafana
    # running outside compose.
    ports:
      - "${GATE_DB_PORT:-127.0.0.1:5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gate} -d ${POSTGRES_DB:-emso_gate}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  grafana:
    container_name: emso-gate-grafana
    image: grafana/grafana:13.0-slim
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - grafana/.env
    environment:
      # Consumed by grafana/provisioning/datasources/gate.yaml, so the
      # datasource is not another place credentials have to be kept in sync.
      GATE_DB_HOST: database:5432
      GATE_DB_NAME: ${POSTGRES_DB:-emso_gate}
      GATE_DB_USER: ${POSTGRES_USER:-gate}
      GATE_DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/data:/var/lib/grafana

  # Optional. ./gate.py runs on the host with `pip install -r requirements.txt`
  # and GATE_DATABASE_URL pointing at the database service above; this one-shot
  # job is for hosts without the engine's compiled dependencies.
  gate:
    container_name: emso-gate
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    depends_on:
      database:
        condition: service_healthy
    environment:
      GATE_DATABASE_URL: postgresql://${POSTGRES_USER:-gate}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-emso_gate}
    # Run as the invoking user, not root. Everything the gate writes -
    # datasets.xml, its backups, logs/, the engine cache - lands in the
    # bind-mounted working tree, and a root-owned artefact there is what stops
    # ./gate.py working on the host afterwards. Export UID/GID, or set them in
    # .env, if the defaults are not yours.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      # The repository itself: federation/, database/sql/, the engine cache and
      # the generated erddap/datasets.xml all live here, so it must be writable.
      - .:/app
    working_dir: /app
    command: ["--help"]
