# Dashboards are provisioned from files, but stay editable in the UI.
#
# allowUiUpdates: true lets you rearrange panels and tweak queries in Grafana
# and keep the result. When a change is worth keeping, use the dashboard's
# "Export -> Save to file" and commit the JSON back into grafana/dashboards/ -
# otherwise the next container restart re-reads the file and the edit is gone.
apiVersion: 1

providers:
  - name: EMSO Validation Gate
    orgId: 1
    folder: EMSO
    type: file
    disableDeletion: false
    editable: true
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
