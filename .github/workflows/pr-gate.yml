# ---------------------------------------------------------------------------
# The lock.
#
# `main` is protected: nothing lands except through a pull request whose
# required checks passed. This workflow is those checks.
#
#   authorize   the account that opened the pull request owns every path the
#               pull request changes, per .github/access/access.yaml.
#   registry    the registry the pull request would produce is valid - parses,
#               no unknown keys, no illegal or duplicated datasetIDs across
#               the whole federation.
#
# Why pull_request_target and not pull_request
# --------------------------------------------
# On a `pull_request` event GitHub runs the workflow file *from the pull
# request*. A contributor with write access could therefore edit this file in
# their own branch to neuter the authorization step, and the check would go
# green. `pull_request_target` always runs the copy on the base branch, which
# only an administrator can change - so the rule cannot be edited by the change
# it is judging. That is the whole reason this is the root of trust.
#
# The cost of that choice is a privileged token, and this repository's default
# workflow permission is `write`. The registry job below checks out and
# executes the pull request's own code, so the token is pinned read-only at the
# workflow level. Do not widen it.
#
# Neither job runs on the self-hosted runner, on purpose. An unmerged pull
# request must never execute on the host that serves the central ERDDAP.
# `gate.py check` is offline and imports the compliance engine lazily, so it
# needs neither the database nor emso-metadata-harmonizer, and both jobs fit on
# free GitHub-hosted runners. Deployment stays in validate.yml, after merge.
# ---------------------------------------------------------------------------
name: pr-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# A force-push to the branch supersedes the previous verdict.
concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  authorize:
    name: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      # Whether this pull request is nothing but facility records. The automerge
      # job below reads it; see the comment there for why it matters.
      data_only: ${{ steps.authz.outputs.data_only }}

    steps:
      # The base branch, explicitly: this is the trusted copy of access.yaml
      # and manage_access.py. Checking out the pull request's copy would let it
      # grant itself access.
      - name: Check out the trusted access rules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet 'PyYAML>=6.0'

      - name: The pull request author must own every changed path
        id: authz
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # The account that opened the pull request, as asserted by GitHub.
          # See the verdict below for why this and nothing else decides access.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          # A rename is two paths, and moving a file *out* of a facility folder
          # is a change to that folder - so the pre-rename path counts too.
          gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' \
            | sort -u > changed.txt

          # The files endpoint stops at 3000 paths. A federation pull request
          # touches a handful; a diff that large is not something to wave
          # through on a truncated list.
          if [ "$(wc -l < changed.txt)" -ge 3000 ]; then
            echo "::error::this pull request changes 3000 or more files, which is more" \
                 "than the API will enumerate. Authorization cannot be decided on a" \
                 "truncated diff. Split it."
            exit 1
          fi

          if [ ! -s changed.txt ]; then
            echo "::error::this pull request changes no files. Refusing to authorize" \
                 "an empty diff rather than reporting success for nothing."
            exit 1
          fi

          echo "changed paths:"
          sed 's/^/  /' changed.txt

          # Is this pull request nothing but facility records? Exactly
          # federation/<facility>/<name>.yaml and nothing else - not the
          # README in that folder, not the .template, not a nested path.
          # Recorded before the authorization verdict below, because this step
          # exits non-zero when it denies and a later `echo` would never run.
          #
          # Counted rather than written as `grep -qv`, deliberately. Whether
          # `-q` and `-v` together report "a line failed to match" is not
          # consistent across grep implementations - ugrep returns 1 where GNU
          # grep returns 0 - and silently inverting this test would auto-merge
          # code. Comparing a match count against the line count cannot be read
          # two ways. `|| true` because grep exits 1 on a zero count and this
          # script runs under `set -e`.
          total=$(wc -l < changed.txt)
          records=$(grep -cE '^federation/[^/]+/[^/]+\.yaml$' changed.txt || true)
          echo "paths: $total, of which facility records: $records"
          if [ "$total" -eq "$records" ]; then
            echo "data_only=true" >> "$GITHUB_OUTPUT"
            echo "scope: facility records only"
          else
            echo "data_only=false" >> "$GITHUB_OUTPUT"
            echo "scope: changes more than facility records, so no automerge"
          fi

          # Commit authorship, for the record only. This list decides nothing -
          # read the verdict below for why.
          #
          # Pipe-separated, not @tsv: a commit whose author is unresolvable has
          # an empty middle field, and `read` with a tab IFS collapses the two
          # adjacent tabs because tab is IFS whitespace - which silently shifts
          # the parent count into $login and reads the commit as authored by
          # "1". A pipe is not IFS whitespace, so empty fields survive. Neither
          # a SHA nor a GitHub username can contain one.
          gh api --paginate "repos/$REPO/pulls/$PR/commits" \
            --jq '.[] | [.sha[0:8], (.author.login // ""), (.parents | length)]
                       | map(tostring) | join("|")' \
            > commits.txt

          echo
          echo "commits (informational - not an authorization input):"
          while IFS='|' read -r sha login parents; do
            if [ "${parents:-0}" -ge 2 ]; then
              echo "  $sha  merge commit"
            elif [ -z "$login" ]; then
              echo "  $sha  author email linked to no GitHub account"
            else
              echo "  $sha  @$login"
            fi
          done < commits.txt

          # The verdict. One subject: the account that opened this pull request.
          #
          # This used to judge each commit's `.author.login`, which GitHub
          # derives from the `author.email` baked into the commit object. That
          # field is chosen by whoever runs `git commit` - `--author="x <addr>"`
          # sets it to anything, and the administrator's address is published in
          # this repository's own history. Anyone could therefore open a fork
          # pull request whose commits resolved to the administrator and be
          # granted `folders: ["*"]` by the check meant to stop exactly that.
          #
          # `github.event.pull_request.user.login` is not derived from the
          # contributor's data. It is the authenticated account GitHub recorded
          # as opening the pull request, and nothing a branch contains can
          # change it. So it grants, and commit authorship grants nothing.
          #
          # The commit loop above is kept as output, not as a gate, on purpose:
          # as a hard failure it could only ever deny a pull request that this
          # check has already authorized by its author, and its "email is not
          # linked to any GitHub account" case failed contributors for a
          # condition they often cannot diagnose. Authority now rests on the one
          # identity that is authenticated, so re-judging a spoofable one adds
          # no security and subtracts usability.
          #
          # Consequence worth knowing: whoever *opens* the pull request is
          # answerable for every path in it. A pull request carrying someone
          # else's commits is judged against the opener, not the author - so the
          # Revert button, which authors its pull request to whoever pressed it,
          # is refused for paths that person does not own.
          rc=0
          echo
          echo "=== @$PR_AUTHOR (opened this pull request) ==="
          python3 .github/access/manage_access.py \
            check --author "$PR_AUTHOR" --changed-files changed.txt || rc=1

          if [ "$rc" -ne 0 ]; then
            echo
            echo "::error::@$PR_AUTHOR opened this pull request but is not listed in" \
                 "access.yaml for a path it changes. Nothing was merged and nothing" \
                 "was federated. Either drop those paths, or have an administrator add" \
                 "@$PR_AUTHOR to the owning group in .github/access/access.yaml."
          fi
          exit "$rc"

  registry:
    name: registry
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # This job checks out and executes the pull request's own code, so it gets
    # the narrowest token available and no secrets. It is deliberately ordered
    # after `authorize`: an unauthorized change is never even parsed.
    permissions:
      contents: read

    steps:
      - name: Check out the proposed registry
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Deliberately not requirements.txt. That pins emso-metadata-harmonizer,
      # which needs compiled netCDF and UDUNITS and is the reason the gate runs
      # in a container on the deployment host. `gate.py check` never reaches
      # it: the engine is imported inside the scoring functions, not at module
      # level. These three are what `validation_gate` imports on the way in.
      #
      # Verified against a clean checkout with no .env and no database: the
      # check validates all 206 datasets and exits 0 with nothing else present.
      # If `gate.py check` ever starts failing here with ModuleNotFoundError,
      # something grew a module-level import and this list needs the new name -
      # do not "fix" it by installing requirements.txt.
      - name: Install the offline dependencies
        run: pip install --quiet 'psycopg2-binary>=2.9,<3' 'PyYAML>=6.0' 'rich>=13.0'

      # Offline and seconds long: YAML syntax, unknown keys, illegal
      # datasetIDs, and duplicates across every facility - not just the one
      # this pull request touches. The gate builds the federation
      # all-or-nothing, so one malformed record means no datasets.xml is
      # written at all. Catching it here is the difference between a red check
      # on one pull request and the whole federation serving a stale file.
      - name: Validate the registry
        run: |
          set -o pipefail
          python gate.py check | tee registry.txt

      - name: Registry summary
        if: always()
        run: |
          {
            echo '### Registry check'
            echo
            echo '```'
            cat registry.txt 2>/dev/null \
              || echo 'the registry check produced no output; see the step log'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # Hands off: a facility opens a pull request and touches nothing else.
  #
  # Limited to pull requests that change only facility records. Code, workflows
  # and access.yaml are admin-authored by definition - `authorize` refuses them
  # from anyone else - and those merge by hand on purpose. Two reasons: a typo
  # in the gate should not deploy itself unreviewed, and auto-merging admin
  # pull requests would merge the first commit the moment it went green, which
  # makes ordinary iterative work impossible.
  #
  # This job executes no repository code and checks nothing out. It only calls
  # the API, which is why it can safely hold write permissions in a
  # pull_request_target workflow.
  # -------------------------------------------------------------------------
  automerge:
    name: automerge
    needs: [authorize, registry]
    if: >-
      needs.authorize.outputs.data_only == 'true'
      && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write        # the merge
      pull-requests: write   # the merge
      actions: write         # dispatching the deployment

    steps:
      - name: Merge, then hand over to the deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # This job deliberately does not check the pull request out - on
          # `pull_request_target` that would put untrusted code next to a
          # write-scoped token. Without a working copy `gh` has no git remote
          # to infer the repository from, so every call names it with -R.
          #
          # The ruleset is still the authority. GITHUB_TOKEN is in no bypass
          # list, so this call succeeds only while `authorize` and `registry`
          # are green on the head commit - this job cannot merge anything the
          # rules would refuse. It merges directly rather than arming GitHub's
          # auto-merge because it already knows both checks passed: it needed
          # them.
          #
          # GitHub can take a moment to publish the conclusions the ruleset
          # reads, so an early attempt may be refused for a merge that is
          # perfectly valid a few seconds later. The second check covers the
          # case where the merge landed but the CLI still reported an error.
          # It reads `state`, because `merged` is not a field `gh pr view`
          # knows and asking for one it does not know is itself an error.
          merged=no
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$PR" -R "$REPO" --squash; then
              merged=yes; break
            fi
            if [ "$(gh pr view "$PR" -R "$REPO" --json state --jq .state)" = "MERGED" ]; then
              merged=yes; break
            fi
            echo "attempt $attempt did not merge; retrying in 10s"
            sleep 10
          done

          if [ "$merged" != "yes" ]; then
            echo "::error::could not merge #$PR after five attempts. Nothing was" \
                 "merged and nothing was deployed. Merge it by hand, and read the" \
                 "gh output above for the reason rather than assuming the ruleset" \
                 "refused it: a required check may have been re-run, the branch may" \
                 "conflict with main, or the call may have failed before the ruleset" \
                 "ever saw it."
            exit 1
          fi
          echo "merged #$PR"

          # A push made with GITHUB_TOKEN raises no push event, so validate.yml
          # would never run and the federation would quietly stop updating while
          # every pull request went green. workflow_dispatch is one of the two
          # documented exceptions, so the deployment is dispatched explicitly.
          #
          # mode=new is what a human push used to do: score what this merge
          # added, not all 206. trigger=push keeps the runs table honest - this
          # is a push to main, performed by the gate rather than by a person.
          gh workflow run validate.yml -R "$REPO" --ref main -f mode=new -f trigger=push
          echo "dispatched validate.yml (mode=new) for #$PR"

      - name: Summary
        if: always()
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### Automerge"
            echo
            echo "Pull request #$PR changed facility records only, both checks"
            echo "passed, so it was merged and the deployment was dispatched."
          } >> "$GITHUB_STEP_SUMMARY"
