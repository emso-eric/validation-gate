# ---------------------------------------------------------------------------
# The validation gate.
#
#   push to main      -> run new      only datasets never validated before, so
#                                     adding one dataset scores one dataset,
#                                     not 206.
#   workflow_dispatch -> run pending  everything not currently healthy. This is
#                                     the button a facility presses after it
#                                     has fixed its metadata: nothing in the
#                                     registry changed, so `new` would find
#                                     nothing, but `pending` re-checks it.
#
# Both triggers do the same three things, in /opt/gate: fast-forward to the
# commit on GitHub, parse the registry, then validate and federate.
#
# Everything runs in the deployment, not in the runner's throwaway workspace.
# The gate writes datasets.xml where the central ERDDAP reads it and keeps the
# ~115 MB compliance cache warm between runs; a copy in the workspace would do
# neither. That is also why there is no actions/checkout step.
#
# workflow_dispatch already requires write permission on the repository, so
# every facility that can push its own config can also trigger this, and nobody
# else can. There is no extra permission to configure.
# ---------------------------------------------------------------------------
name: validation-gate

on:
  push:
    branches: [main]
  workflow_dispatch:

# One gate run at a time. Two concurrent runs would race on datasets.xml and
# the loser would deploy a stale file. The gate also holds a PostgreSQL
# advisory lock, which is what serialises this against anything running on the
# host; this group just avoids queueing runs that would exit 2 on arrival.
concurrency:
  group: validation-gate
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Where the central node is checked out on the runner's host. Override with a
  # repository variable if the path differs.
  GATE_DEPLOYMENT: ${{ vars.GATE_DEPLOYMENT || '/opt/gate' }}

  # A push validates what it added; the manual button re-checks what is broken.
  MODE: ${{ github.event_name == 'workflow_dispatch' && 'pending' || 'new' }}
  TRIGGER: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'push' }}

jobs:
  gate:
    name: validate and federate
    runs-on: [self-hosted, validation-gate]
    # `run pending` can probe every declared dataset on third-party servers.
    # Generous, but bounded: without this, one hung HTTP request holds the
    # advisory lock and every later run exits 2 until somebody notices.
    timeout-minutes: 120

    defaults:
      run:
        working-directory: ${{ vars.GATE_DEPLOYMENT || '/opt/gate' }}

    steps:
      # --ff-only is the safety property: if the deployment has local commits
      # or has diverged, this fails loudly instead of discarding them.
      - name: Pull the latest commit into the deployment
        run: |
          # The manual button can be fired from any branch, and the
          # fast-forward below would then deploy that branch to the live node.
          # Only main is deployable.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::this workflow deploys $GATE_DEPLOYMENT and only runs" \
                 "on main, not on $GITHUB_REF."
            exit 1
          fi
          if [ ! -x venv/bin/python ]; then
            echo "::error::no interpreter at $GATE_DEPLOYMENT/venv/bin/python." \
                 "This runner must have the deployment checked out at" \
                 "\$GATE_DEPLOYMENT with its venv created" \
                 "(python3 -m venv venv && venv/bin/pip install -r requirements.txt)."
            exit 1
          fi
          git fetch --quiet origin
          git merge --ff-only --quiet "$GITHUB_SHA"
          echo "deployment now at $(git rev-parse --short HEAD)"

      # Offline, seconds: YAML syntax, unknown keys, illegal datasetIDs,
      # duplicates across the whole federation. The gate builds the federation
      # all-or-nothing, so one malformed file means no datasets.xml is written
      # at all. Failing here leaves the live federation serving the previous
      # file, instead of one facility's bad push taking every facility down.
      - name: Validate the registry
        run: venv/bin/python gate.py check

      - name: Validate, record and federate
        env:
          GATE_DATABASE_URL: ${{ secrets.GATE_DATABASE_URL }}
        run: |
          set +e
          venv/bin/python gate.py run "$MODE" --trigger "$TRIGGER"
          rc=$?
          set -e
          case "$rc" in
            0) echo "::notice::gate run '$MODE': every checked dataset is healthy" ;;
            1) echo "::warning::gate run '$MODE': completed, but some datasets are blocked or unreachable - see the summary" ;;
            2) echo "::error::another gate instance holds the advisory lock; nothing was validated or deployed"; exit 1 ;;
            *) echo "::error::gate failed to run (exit $rc)"; exit "$rc" ;;
          esac

      # Exit 1 means "the run completed and something is not healthy", which is
      # the normal state of a federation of third-party servers, not a build
      # failure. Only exit 2 and above fail the job, so these counts are what a
      # facility actually reads after pressing the button.
      - name: Federation summary
        if: always()
        env:
          GATE_DATABASE_URL: ${{ secrets.GATE_DATABASE_URL }}
        run: |
          {
            echo '### Federation status'
            echo
            echo '```'
            venv/bin/python gate.py summary --log-dir '' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
