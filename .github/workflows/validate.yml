# ---------------------------------------------------------------------------
# The validation gate: deployment.
#
# This is the half that runs after a change has landed on main. It is not the
# lock. Nothing reaches main except through a pull request that passed the
# checks in pr-gate.yml, and that is where authorization is decided - before
# the merge, on a hosted runner, from the base branch's copy of the rules.
# Read pr-gate.yml first if you are trying to work out who may change what.
#
#   push to main      -> run new      only datasets never validated before, so
#                                     adding one dataset scores one dataset,
#                                     not 206.
#   workflow_dispatch -> run pending  everything not currently healthy. This is
#                                     the button a facility presses after it
#                                     has fixed its metadata: nothing in the
#                                     registry changed, so `new` would find
#                                     nothing, but `pending` re-checks it.
#
# The `mode` and `trigger` inputs exist for one caller: the automerge job in
# pr-gate.yml, which dispatches this workflow with mode=new after it merges a
# facility record. It has to dispatch rather than rely on the push trigger,
# because a merge performed with GITHUB_TOKEN raises no push event at all -
# workflow_dispatch is one of the two documented exceptions to that rule. Leave
# both at their defaults when you run this by hand.
#
# Both triggers do the same three things, in /opt/gate: fast-forward to the
# commit on GitHub, parse the registry, then validate and federate.
#
# Everything runs in the deployment, not in the runner's throwaway workspace.
# The gate writes datasets.xml where the central ERDDAP reads it and keeps the
# ~115 MB compliance cache warm between runs; a copy in the workspace would do
# neither. That is also why there is no actions/checkout step.
#
# workflow_dispatch already requires write permission on the repository, so
# every facility that can push its own config can also trigger this, and nobody
# else can. There is no extra permission to configure.
# ---------------------------------------------------------------------------
name: validation-gate

on:
  push:
    branches: [main]
    # Documentation cannot change what the gate would decide, and a run is not
    # free: it takes the advisory lock, regenerates datasets.xml and reloads
    # the central ERDDAP. A typo fix should not do any of that. Only prose is
    # listed here - never a path that feeds a decision, so federation records,
    # validation-gate.yaml, access.yaml and the workflows all still trigger a
    # run. A facility that needs one anyway can press Run workflow, which is
    # unaffected by this filter.
    paths-ignore:
      - '**.md'
      - LICENSE
  workflow_dispatch:
    inputs:
      mode:
        description: what to validate
        type: choice
        default: pending
        options: [new, pending, all]
      trigger:
        description: how the runs table should record this run
        type: choice
        default: manual
        options: [manual, push, schedule]

# One gate run at a time. Two concurrent runs would race on datasets.xml and
# the loser would deploy a stale file. The gate also holds a PostgreSQL
# advisory lock, which is what serialises this against anything running on the
# host; this group just avoids queueing runs that would exit 2 on arrival.
concurrency:
  group: validation-gate
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Where the central node is checked out on the runner's host. Override with a
  # repository variable if the path differs.
  GATE_DEPLOYMENT: ${{ vars.GATE_DEPLOYMENT || '/opt/gate' }}

  # A push validates what it added; the manual button re-checks what is broken.
  # A dispatch carries both explicitly, so the automerge job can ask for exactly
  # what a push used to do - and have the runs table say so.
  MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'new' }}
  TRIGGER: ${{ github.event_name == 'workflow_dispatch' && inputs.trigger || 'push' }}

jobs:
  gate:
    name: validate and federate
    runs-on: [self-hosted, validation-gate]
    # `run pending` can probe every declared dataset on third-party servers.
    # Generous, but bounded: without this, one hung HTTP request holds the
    # advisory lock and every later run exits 2 until somebody notices.
    timeout-minutes: 120

    defaults:
      run:
        working-directory: ${{ vars.GATE_DEPLOYMENT || '/opt/gate' }}

    steps:
      # --ff-only is the safety property: if the deployment has local commits
      # or has diverged, this fails loudly instead of discarding them.
      - name: Pull the latest commit into the deployment
        run: |
          # The manual button can be fired from any branch, and the
          # fast-forward below would then deploy that branch to the live node.
          # Only main is deployable.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::this workflow deploys $GATE_DEPLOYMENT and only runs" \
                 "on main, not on $GITHUB_REF."
            exit 1
          fi
          if [ ! -x venv/bin/python ]; then
            echo "::error::no interpreter at $GATE_DEPLOYMENT/venv/bin/python." \
                 "This runner must have the deployment checked out at" \
                 "\$GATE_DEPLOYMENT with its venv created" \
                 "(python3 -m venv venv && venv/bin/pip install -r requirements.txt)."
            exit 1
          fi
          git fetch --quiet origin
          git merge --ff-only --quiet "$GITHUB_SHA"
          echo "deployment now at $(git rev-parse --short HEAD)"

      # Who pushed decides which paths they were allowed to touch. This runs
      # after the push has landed - GitHub Actions cannot reject a push - so it
      # is not a permission, it is a brake: the job fails here and `gate.py
      # run` below never executes, so an unauthorised edit never reaches the
      # central ERDDAP. The offending commit stays in the branch for a human to
      # revert.
      #
      # Push rulesets used to be the intended enforcement. They are not
      # available: they require a private or internal repository, and this one
      # is public. The enforcement is now the required check in pr-gate.yml,
      # which refuses the merge. This step is kept as the backstop for the case
      # branch protection is disabled, bypassed or never applied to a new
      # branch pattern - it is version-controlled, testable offline and fails
      # closed, which GitHub's settings are not.
      #
      # Known edge: this judges `github.actor`, the account that pushed, which
      # on a merge is whoever pressed the button rather than the author of the
      # work. A facility member merging an administrator's code pull request
      # therefore fails here, after pr-gate.yml has already authorized it
      # correctly. That is a false failure, not an escape: nothing is
      # federated, and an administrator can re-run it with workflow_dispatch.
      # The fix is to judge the pushed commits' authors instead, as pr-gate.yml
      # does; left alone for now so the lock lands as one reviewable change.
      - name: Enforce access rules
        if: github.event_name == 'push'
        env:
          # The account that pushed, not the commit author: a commit can claim
          # any author it likes, but the push is authenticated.
          PUSHER: ${{ github.actor }}
          BEFORE: ${{ github.event.before }}
        run: |
          # On a force push or a freshly created branch, event.before is either
          # the all-zero sha or an object that is no longer reachable. Fall back
          # to the pushed commit's own diff rather than silently checking
          # nothing.
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$GITHUB_SHA"
          else
            echo "::warning::$BEFORE is not available; checking only $GITHUB_SHA"
            range="$GITHUB_SHA^..$GITHUB_SHA"
          fi
          git diff --name-only "$range" > /tmp/changed.txt
          echo "changed paths in $range:"
          venv/bin/python .github/access/manage_access.py check \
            --author "$PUSHER" --changed-files /tmp/changed.txt

      # Offline, seconds: YAML syntax, unknown keys, illegal datasetIDs,
      # duplicates across the whole federation. The gate builds the federation
      # all-or-nothing, so one malformed file means no datasets.xml is written
      # at all. Failing here leaves the live federation serving the previous
      # file, instead of one facility's bad push taking every facility down.
      - name: Validate the registry
        run: venv/bin/python gate.py check

      # No GATE_DATABASE_URL here. The runner is the database host, so the
      # credentials come from $GATE_DEPLOYMENT/.env, which is where
      # `gate.py password-rotate` writes them. A repository secret would be a
      # second copy of the same password that rotation cannot reach, and it
      # would drift silently the first time the password changed.
      - name: Validate, record and federate
        run: |
          set +e
          venv/bin/python gate.py run "$MODE" --trigger "$TRIGGER"
          rc=$?
          set -e
          case "$rc" in
            0) echo "::notice::gate run '$MODE': every checked dataset is healthy" ;;
            1) echo "::warning::gate run '$MODE': completed, but some datasets are blocked or unreachable - see the summary" ;;
            2) echo "::error::another gate instance holds the advisory lock; nothing was validated or deployed"; exit 1 ;;
            *) echo "::error::gate failed to run (exit $rc)"; exit "$rc" ;;
          esac

      # Exit 1 means "the run completed and something is not healthy", which is
      # the normal state of a federation of third-party servers, not a build
      # failure. Only exit 2 and above fail the job, so these counts are what a
      # facility actually reads after pressing the button.
      - name: Federation summary
        if: always()
        run: |
          {
            echo '### Federation status'
            echo
            echo '```'
            venv/bin/python gate.py summary --log-dir '' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
