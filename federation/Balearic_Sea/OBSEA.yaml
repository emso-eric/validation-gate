# Balearic_Sea - datasets federated from https://data.obsea.es/erddap
#
# A datasetID with nothing after it uses the defaults: tabledap, and
# the URL derived as <url>/<type>/<datasetID>. Add a body only to
# override one of those or to set a defaultQuery.
#
# Migrated from the config/<Facility>/ layout.
